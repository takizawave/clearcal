<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar Look</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <header>
      <span class="icon" aria-hidden="true">31</span>
      <div><h1>Calendar Look</h1><p>for Notion Calendar</p></div>
    </header>
    <main>
      <label class="setting" for="enabled">
        <span><strong>Google Calendar風の表示</strong><small>開いているカレンダーに反映します</small></span>
        <input id="enabled" type="checkbox" role="switch" disabled>
      </label>
      <label class="mode-label" for="mode">配色</label>
      <select id="mode" disabled>
        <option value="light">ライト · Google Calendar風</option>
        <option value="dark">ダーク · Google Calendar風</option>
      </select>
      <p class="description">予定の色をくっきり、文字は読みやすく。<br>レイアウトはそのまま、配色だけを変えます。</p>
      <p id="status" role="status" aria-live="polite">設定を読み込み中…</p>
      <a href="https://calendar.notion.so/" target="_blank" rel="noopener noreferrer">Notion Calendarを開く <span aria-hidden="true">↗</span></a>
    </main>
    <footer>予定の内容・同期先は変更しません。<br>Google / Notionの公式拡張ではありません。</footer>
  </body>
</html>
